[package]
name = "nomake"
version = "0.1.0"
edition = "2021"
description = "Fast C/C++ build engine: Cargo ergonomics, Ninja-style DAG execution"
license = "MIT"
readme = "README.md"
keywords = ["c", "cpp", "build", "build-system"]
categories = ["development-tools::build-utils"]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
